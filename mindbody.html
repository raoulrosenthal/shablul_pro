<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Swim Booker</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/7/77/Swimmer_icon.svg/512px-Swimmer_icon.svg.png">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 20px; background-color: #f2f2f7; color: #1c1c1e; }
        .container { max-width: 420px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { text-align: center; margin-top: 0; margin-bottom: 4px; }
        .subtitle { text-align: center; font-size: 13px; color: #007aff; font-weight: 600; margin-bottom: 16px; }
        .slot-label { font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px; font-size: 12px; color: #8e8e93; text-transform: uppercase; letter-spacing: 0.5px; }
        select, input[type="time"] { width: 100%; padding: 10px; border: 1px solid #d1d1d6; border-radius: 8px; font-size: 16px; box-sizing: border-box; background: white; }
        .row { display: flex; gap: 10px; margin-bottom: 5px; }
        .row select { flex: 2; }
        .row input { flex: 1; }

        /* Info Panels */
        .info-card { background: #f8f8fa; border: 1px solid #e5e5ea; border-radius: 10px; padding: 12px 14px; margin-top: 14px; }
        .info-card-header { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 700; color: #636366; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 8px; }
        .sync-note { font-size: 10px; font-weight: normal; color: #8e8e93; text-transform: none; letter-spacing: 0; }
        .info-list { list-style: none; padding: 0; margin: 0; font-size: 14px; }
        .info-list li { padding: 6px 0; border-bottom: 1px solid #ececf0; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .info-list li:last-child { border-bottom: none; padding-bottom: 2px; }
        .empty-text { color: #8e8e93; font-size: 13px; font-style: italic; padding: 2px 0; }
        .badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
        .badge-repeat { background: #e5f1ff; color: #007aff; }
        .badge-once { background: #fff3e0; color: #e67e00; }
        .badge-booked { background: #e8f8ed; color: #248a3d; }

        /* Recurring Checkbox Style */
        .recurring-row { display: flex; align-items: center; margin-bottom: 15px; font-size: 14px; color: #3a3a3c; }
        .recurring-row input[type="checkbox"] { margin-right: 8px; width: 18px; height: 18px; accent-color: #007aff; }

        .toggle-container { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; padding: 10px 0; border-top: 1px solid #e5e5ea; border-bottom: 1px solid #e5e5ea; }
        .switch { position: relative; display: inline-block; width: 50px; height: 30px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #d1d1d6; transition: .4s; border-radius: 30px; }
        .slider:before { position: absolute; content: ""; height: 26px; width: 26px; left: 2px; bottom: 2px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #34c759; }
        input:checked + .slider:before { transform: translateX(20px); }
        button { width: 100%; background-color: #007aff; color: white; border: none; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 8px; margin-top: 10px; cursor: pointer; }
        button:active { background-color: #005bb5; }

        /* Premium Button Styles */
        .premium-btn { background-color: #ff9f0a; margin-top: 15px; font-size: 16px; }
        .premium-btn:active { background-color: #cc7f08; }

        #status { margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>ShablulPro 🐌</h2>
    <div class="subtitle">Mindbody Edition</div>

    <label class="slot-label" for="userSelect" style="margin-top: 0;">User</label>
    <select id="userSelect" onchange="loadUserData()">
        <option value="raoul">Raoul</option>
        <option value="debby">Debby</option>
        <option value="jasmin">Jasmin</option>
    </select>

    <!-- UPCOMING MINDBODY BOOKINGS -->
    <div class="info-card">
        <div class="info-card-header">
            <span>📅 Upcoming Bookings</span>
            <span class="sync-note" id="syncTimestamp"></span>
        </div>
        <div id="upcomingBookingsContent" class="empty-text">Loading...</div>
    </div>

    <!-- CURRENT AUTO-BOOKING SETTINGS -->
    <div class="info-card">
        <div class="info-card-header">
            <span>⚙️ Current Booking Settings</span>
        </div>
        <div id="currentSettingsContent" class="empty-text">Loading...</div>
    </div>

    <div class="toggle-container">
        <label for="emailNotif" style="margin: 0; font-size: 16px; color: #1c1c1e; font-weight: normal;">📧 Email on Failure</label>
        <label class="switch">
            <input type="checkbox" id="emailNotif" checked>
            <span class="slider"></span>
        </label>
    </div>

    <!-- SLOT 1 -->
    <label class="slot-label">Swim 1</label>
    <div class="row">
        <select id="day1">
            <option value="">-- None --</option>
            <option value="Monday">Monday</option>
            <option value="Tuesday">Tuesday</option>
            <option value="Wednesday">Wednesday</option>
            <option value="Thursday">Thursday</option>
            <option value="Friday">Friday</option>
            <option value="Saturday">Saturday</option>
            <option value="Sunday">Sunday</option>
        </select>
        <input type="time" id="time1" value="06:15">
    </div>
    <div class="recurring-row">
        <input type="checkbox" id="recurring1">
        <label for="recurring1" style="font-weight: normal; margin: 0;">Repeat weekly</label>
    </div>

    <!-- SLOT 2 -->
    <label class="slot-label">Swim 2 (Optional)</label>
    <div class="row">
        <select id="day2">
            <option value="">-- None --</option>
            <option value="Monday">Monday</option>
            <option value="Tuesday">Tuesday</option>
            <option value="Wednesday">Wednesday</option>
            <option value="Thursday">Thursday</option>
            <option value="Friday">Friday</option>
            <option value="Saturday">Saturday</option>
            <option value="Sunday">Sunday</option>
        </select>
        <input type="time" id="time2" value="06:15">
    </div>
    <div class="recurring-row">
        <input type="checkbox" id="recurring2">
        <label for="recurring2" style="font-weight: normal; margin: 0;">Repeat weekly</label>
    </div>

    <!-- SLOT 3 -->
    <label class="slot-label">Swim 3 (Optional)</label>
    <div class="row">
        <select id="day3">
            <option value="">-- None --</option>
            <option value="Monday">Monday</option>
            <option value="Tuesday">Tuesday</option>
            <option value="Wednesday">Wednesday</option>
            <option value="Thursday">Thursday</option>
            <option value="Friday">Friday</option>
            <option value="Saturday">Saturday</option>
            <option value="Sunday">Sunday</option>
        </select>
        <input type="time" id="time3" value="06:15">
    </div>
    <div class="recurring-row">
        <input type="checkbox" id="recurring3">
        <label for="recurring3" style="font-weight: normal; margin: 0;">Repeat weekly</label>
    </div>

    <button onclick="submitSchedule()">Save Weekly Plan</button>

    <!-- The Trap -->
    <button class="premium-btn" onclick="triggerPaywall()">⭐️ Buy a subscription to ShablulPro for $9.99/month</button>

    <div id="status"></div>
</div>

<script>
    const API_URL = "https://ym1b9m0605.execute-api.us-east-1.amazonaws.com/prod/schedule";

    function triggerPaywall() {
        alert("Authenticating Face ID...\n\nPayment of $9.99/month confirmed! Thank you for subscribing to ShablulPro. No refunds.");
    }

    function formatTime12h(hhmm) {
        if (!hhmm || !hhmm.includes(":")) return hhmm || "";
        const parts = hhmm.split(":");
        const h = parseInt(parts[0], 10);
        const m = parts[1];
        const ampm = h < 12 ? "AM" : "PM";
        const h12 = h % 12 || 12;
        return `${h12}:${m}${ampm}`;
    }

    function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str || "";
        return div.innerHTML;
    }

    function renderUserPanels(data) {
        const upcomingEl = document.getElementById("upcomingBookingsContent");
        const settingsEl = document.getElementById("currentSettingsContent");
        const syncEl = document.getElementById("syncTimestamp");

        syncEl.textContent = data.bookings_synced_at ? `Synced ${data.bookings_synced_at}` : "";

        // 1. Render Upcoming Mindbody Bookings
        const upcoming = Array.isArray(data.upcoming_bookings) ? data.upcoming_bookings : [];
        if (upcoming.length === 0) {
            upcomingEl.className = "empty-text";
            upcomingEl.innerHTML = "No upcoming Mindbody pool reservations.";
        } else {
            upcomingEl.className = "";
            const items = upcoming.map(b => {
                const label = `${escapeHtml(b.date)} • ${escapeHtml(b.time)}`;
                const rawCls = (b.class_name || "Lane Reservation")
                    .replace(/\s*(Late Cancel|Cancel)\s*$/i, "")
                    .replace(/^Lane Reservation Pool$/i, "Lane Reservation (Pool)");
                const cls = escapeHtml(rawCls);
                return `<li><span>${label}</span><span class="badge badge-booked">${cls}</span></li>`;
            }).join("");
            upcomingEl.innerHTML = `<ul class="info-list">${items}</ul>`;
        }

        // 2. Render Current Auto-Booking Settings
        const schedules = Array.isArray(data.schedules) ? data.schedules : [];
        if (schedules.length === 0) {
            settingsEl.className = "empty-text";
            settingsEl.innerHTML = "No auto-booking slots configured.";
        } else {
            settingsEl.className = "";
            const items = schedules.map(s => {
                const dayTime = `${escapeHtml(s.day_of_week)} ${escapeHtml(formatTime12h(s.time))}`;
                const badge = s.recurring
                    ? `<span class="badge badge-repeat">repeat weekly</span>`
                    : `<span class="badge badge-once">no repeat</span>`;
                return `<li><span>${dayTime}</span>${badge}</li>`;
            }).join("");
            settingsEl.innerHTML = `<ul class="info-list">${items}</ul>`;
        }

        // 3. Populate Form Inputs to match current saved settings
        document.getElementById("emailNotif").checked = data.email_notification !== false;
        for (let i = 1; i <= 3; i++) {
            const sched = schedules[i - 1];
            document.getElementById("day" + i).value = sched ? sched.day_of_week : "";
            document.getElementById("time" + i).value = sched ? sched.time : "06:15";
            document.getElementById("recurring" + i).checked = sched ? !!sched.recurring : false;
        }
    }

    async function loadUserData() {
        const userId = document.getElementById("userSelect").value;
        const upcomingEl = document.getElementById("upcomingBookingsContent");
        const settingsEl = document.getElementById("currentSettingsContent");
        const statusDiv = document.getElementById("status");
        statusDiv.innerText = "";

        upcomingEl.className = "empty-text";
        upcomingEl.innerText = "Loading...";
        settingsEl.className = "empty-text";
        settingsEl.innerText = "Loading...";

        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ action: "get", user_id: userId })
            });
            if (!response.ok) throw new Error("Failed to load user data");
            const data = await response.json();
            renderUserPanels(data);
        } catch (err) {
            upcomingEl.innerText = "Could not load upcoming bookings.";
            settingsEl.innerText = "Could not load current settings.";
            console.error(err);
        }
    }

    async function submitSchedule() {
        const userId = document.getElementById('userSelect').value;
        const emailNotif = document.getElementById('emailNotif').checked;
        const statusDiv = document.getElementById('status');

        const schedules = [];
        for (let i = 1; i <= 3; i++) {
            const day = document.getElementById('day' + i).value;
            const time = document.getElementById('time' + i).value;
            const isRecurring = document.getElementById('recurring' + i).checked;

            if (day !== "") {
                schedules.push({
                    day_of_week: day,
                    time: time,
                    recurring: isRecurring
                });
            }
        }

        statusDiv.innerText = "Saving...";
        statusDiv.style.color = "#8e8e93";

        const payload = {
            action: "save",
            user_id: userId,
            platform: "mindbody",
            is_active: true,
            email_notification: emailNotif,
            schedules: schedules
        };

        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                statusDiv.innerText = "✅ Saved Successfully!";
                statusDiv.style.color = "#34c759";
                await loadUserData();
                statusDiv.innerText = "✅ Saved Successfully!";
                statusDiv.style.color = "#34c759";
            } else {
                throw new Error("Server rejected request");
            }
        } catch (error) {
            statusDiv.innerText = "❌ Error saving data.";
            statusDiv.style.color = "#ff3b30";
            console.error(error);
        }
    }

    window.addEventListener("DOMContentLoaded", loadUserData);
</script>

</body>
</html>
